name: Sync to emin-giri

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to emin-giri
        uses: wei/git-sync@v3
        with:
          source_repo: "emin-girimhanov/emin-girimhanov"
          source_branch: "main"
          destination_repo: "https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/emin-giri/emin-giri.git"
          destination_branch: "main"
