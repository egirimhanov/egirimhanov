<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgRobot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <filter id="shadowRob" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgRobot)"/>
  
  <!-- Header Bar -->
  <rect width="1200" height="54" fill="#060913"/>
  <text x="40" y="34" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8" letter-spacing="1.5">🤖 INFORMATIK KURSARBEIT &amp; SENSORIK</text>
  <text x="1160" y="34" font-family="sans-serif" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="end">3D-Druck Chassis • Dual Extruder • Aktorik</text>
  <line x1="0" y1="54" x2="1200" y2="54" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Robot Blueprint & Top View Chassis -->
  <g transform="translate(600, 360)" filter="url(#shadowRob)">
    <!-- Main 3D Printed Chassis Base Frame (Orange / Dark Metallic) -->
    <rect x="-240" y="-180" width="480" height="360" rx="30" fill="#ea580c" stroke="#f97316" stroke-width="6"/>
    <rect x="-220" y="-160" width="440" height="320" rx="20" fill="#1e293b" stroke="#475569" stroke-width="4"/>

    <!-- Dual Heavy Drive Wheels (Left & Right) -->
    <rect x="-280" y="-120" width="45" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="235" y="-120" width="45" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>

    <rect x="-280" y="20" width="45" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="235" y="20" width="45" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>

    <!-- Electronics & Microcontroller Board (Arduino / Raspberry / Motor Driver) -->
    <rect x="-140" y="-110" width="280" height="160" rx="12" fill="#065f46" stroke="#10b981" stroke-width="3"/>
    <!-- Chips & Sensors -->
    <rect x="-110" y="-90" width="70" height="70" rx="6" fill="#047857"/>
    <circle cx="-75" cy="-55" r="16" fill="#38bdf8"/>
    <rect x="-10" y="-90" width="120" height="40" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <text x="50" y="-65" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">MOTOR CONTROLLER</text>

    <!-- Ultrasonic Distance Sensors (Front) -->
    <circle cx="-100" cy="-170" r="16" fill="#facc15" stroke="#ffffff" stroke-width="3"/>
    <circle cx="100" cy="-170" r="16" fill="#facc15" stroke="#ffffff" stroke-width="3"/>

    <!-- Mower Cutter Blade Disc (Center/Bottom) -->
    <circle cx="0" cy="100" r="60" fill="#334155" stroke="#94a3b8" stroke-width="3"/>
    <line x1="-50" y1="100" x2="50" y2="100" stroke="#ef4444" stroke-width="4"/>
    <line x1="0" y1="50" x2="0" y2="150" stroke="#ef4444" stroke-width="4"/>
  </g>

  <!-- Side Overlay Information Box -->
  <rect x="40" y="520" width="520" height="110" rx="12" fill="rgba(15, 23, 42, 0.92)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="552" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff">Eigenkonstruierter Autonomer Mähroboter</text>
  <text x="60" y="578" font-family="sans-serif" font-size="13" fill="#cbd5e1">Sämtliche Bauteile im 3D-Druck selbst gefertigt (CJD Droyßig Kursarbeit)</text>
  <text x="60" y="600" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="600">Digitale Steuerung, Sensorik &amp; Aktorik • Ausgezeichnet mit Sonderpreis 2024</text>
</svg>
