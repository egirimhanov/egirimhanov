<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#1a233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Grid overlay -->
  <path d="M0 75 h1200 M0 150 h1200 M0 225 h1200 M0 300 h1200 M0 375 h1200 M0 450 h1200 M0 525 h1200 M0 600 h1200" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  
  <!-- Browser Frame Header -->
  <rect width="1200" height="42" fill="#070a0f"/>
  <circle cx="20" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="21" r="6" fill="#27c93f"/>
  <rect x="180" y="8" width="840" height="26" rx="13" fill="rgba(255,255,255,0.07)"/>
  <text x="600" y="25" fill="#9ca3af" font-family="monospace" font-size="12" text-anchor="middle">https://autohaus-kleinjena.netlify.app/</text>

  <!-- Navbar -->
  <rect y="42" width="1200" height="60" fill="rgba(10,13,20,0.9)"/>
  <text x="40" y="78" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">AUTOHAUS <tspan fill="#38bdf8">KLEINJENA</tspan></text>
  <text x="850" y="77" fill="#d1d5db" font-family="sans-serif" font-size="14">Fahrzeuge</text>
  <text x="940" y="77" fill="#d1d5db" font-family="sans-serif" font-size="14">Service</text>
  <text x="1020" y="77" fill="#d1d5db" font-family="sans-serif" font-size="14">Über uns</text>
  <rect x="1100" y="60" width="60" height="28" rx="6" fill="url(#accent)"/>
  <text x="1130" y="78" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Kontakt</text>

  <!-- Hero Section -->
  <text x="60" y="160" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2">ERSTELLT VON EMIN GIRIMHANOV</text>
  <text x="60" y="210" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="38">Premium Fahrzeuge &amp; Digitaler Service</text>
  <text x="60" y="245" fill="#9ca3af" font-family="sans-serif" font-size="16">Dein modernes Autohaus in Kleinjena – Exklusive Angebote, Probefahrten &amp; Werkstatt-Termine online.</text>

  <!-- Car Grid Showcase -->
  <!-- Card 1 -->
  <rect x="60" y="280" width="340" height="340" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="80" y="300" width="300" height="170" rx="10" fill="#1e293b"/>
  <!-- Car Silhouette 1 -->
  <path d="M120 420 Q160 360 230 360 L290 360 Q340 370 360 420 Z" fill="#38bdf8" opacity="0.6"/>
  <circle cx="160" cy="425" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="320" cy="425" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <text x="80" y="500" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="18">Sport Limousine Edition</text>
  <text x="80" y="525" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="20">€ 48.900,-</text>
  <rect x="80" y="545" width="130" height="32" rx="8" fill="url(#accent)"/>
  <text x="145" y="566" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Probefahrt</text>

  <!-- Card 2 -->
  <rect x="430" y="280" width="340" height="340" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="450" y="300" width="300" height="170" rx="10" fill="#1e293b"/>
  <!-- Car Silhouette 2 -->
  <path d="M480 420 Q520 350 600 350 L660 350 Q710 365 730 420 Z" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="530" cy="425" r="20" fill="#0f172a" stroke="#8b5cf6" stroke-width="4"/>
  <circle cx="680" cy="425" r="20" fill="#0f172a" stroke="#8b5cf6" stroke-width="4"/>
  <text x="450" y="500" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="18">Performance Coupe GT</text>
  <text x="450" y="525" fill="#8b5cf6" font-family="sans-serif" font-weight="800" font-size="20">€ 62.500,-</text>
  <rect x="450" y="545" width="130" height="32" rx="8" fill="url(#accent)"/>
  <text x="515" y="566" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Probefahrt</text>

  <!-- Card 3 -->
  <rect x="800" y="280" width="340" height="340" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="820" y="300" width="300" height="170" rx="10" fill="#1e293b"/>
  <!-- Car Silhouette 3 -->
  <path d="M850 420 Q880 340 960 340 L1030 340 Q1080 360 1100 420 Z" fill="#34d399" opacity="0.6"/>
  <circle cx="900" cy="425" r="20" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
  <circle cx="1050" cy="425" r="20" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
  <text x="820" y="500" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="18">Elektro SUV Allrad</text>
  <text x="820" y="525" fill="#34d399" font-family="sans-serif" font-weight="800" font-size="20">€ 54.900,-</text>
  <rect x="820" y="545" width="130" height="32" rx="8" fill="url(#accent)"/>
  <text x="885" y="566" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Probefahrt</text>
</svg>
