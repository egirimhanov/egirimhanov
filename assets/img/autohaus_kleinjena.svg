<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Browser Window Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Browser Header Bar -->
  <path d="M 0 0 L 1200 0 L 1200 48 L 0 48 Z" fill="#090d16"/>
  <!-- Window Control Buttons -->
  <circle cx="24" cy="24" r="6" fill="#ef4444"/>
  <circle cx="44" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="24" r="6" fill="#10b981"/>
  
  <!-- URL Address Bar -->
  <rect x="180" y="10" width="840" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Lock Icon -->
  <path d="M 198 21 L 198 18 A 3 3 0 0 1 204 18 L 204 21 M 196 21 L 206 21 L 206 27 L 196 27 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="216" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1" font-weight="500">https://autohaus-kleinjena.netlify.app/</text>

  <!-- Website Header Navbar -->
  <rect x="0" y="48" width="1200" height="64" fill="#0f172a" stroke-bottom="#1e293b"/>
  <line x1="0" y1="112" x2="1200" y2="112" stroke="#334155" stroke-width="1"/>
  
  <!-- Logo -->
  <rect x="40" y="66" width="32" height="28" rx="4" fill="url(#blueGrad)"/>
  <text x="48" y="85" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff">AK</text>
  <text x="82" y="86" font-family="sans-serif" font-weight="800" font-size="18" fill="#ffffff">Autohaus <tspan fill="#3b82f6">Kleinjena</tspan></text>
  
  <!-- Nav Links -->
  <text x="720" y="86" font-family="sans-serif" font-size="14" fill="#94a3b8" font-weight="500">Fahrzeuge</text>
  <text x="820" y="86" font-family="sans-serif" font-size="14" fill="#94a3b8" font-weight="500">Meisterwerkstatt</text>
  <text x="960" y="86" font-family="sans-serif" font-size="14" fill="#94a3b8" font-weight="500">Über uns</text>
  <rect x="1050" y="66" width="110" height="34" rx="6" fill="url(#blueGrad)"/>
  <text x="1072" y="88" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="700">Kontakt ↗</text>

  <!-- Hero Section Content -->
  <!-- Badge -->
  <rect x="40" y="140" width="310" height="28" rx="14" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
  <text x="56" y="159" font-family="sans-serif" font-size="12" fill="#60a5fa" font-weight="600">✨ Geprüfte Gebrauchtwagen &amp; Meisterwerkstatt</text>

  <!-- Headline -->
  <text x="40" y="210" font-family="sans-serif" font-size="34" fill="#ffffff" font-weight="800">Ihr fairer Partner für Automobile</text>
  <text x="40" y="250" font-family="sans-serif" font-size="34" fill="#3b82f6" font-weight="800">&amp; Service in 06618 Kleinjena</text>

  <!-- Subheadline -->
  <text x="40" y="290" font-family="sans-serif" font-size="16" fill="#94a3b8">Seit 2002 Qualität, transparente Gebrauchtwagen-Prüfung und freie KFZ-Meisterwerkstatt.</text>

  <!-- CTA Buttons -->
  <rect x="40" y="320" width="180" height="44" rx="8" fill="url(#blueGrad)"/>
  <text x="64" y="347" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="700">Fahrzeuge ansehen</text>

  <rect x="235" y="320" width="180" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="260" y="347" font-family="sans-serif" font-size="14" fill="#cbd5e1" font-weight="600">Werkstatt-Termin</text>

  <!-- Vehicle Showcase Cards Header -->
  <text x="40" y="415" font-family="sans-serif" font-size="18" fill="#ffffff" font-weight="700">Aktueller Fahrzeugbestand</text>
  <text x="1100" y="415" font-family="sans-serif" font-size="13" fill="#3b82f6" font-weight="600">Alle 18 Autos ↗</text>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="435" width="355" height="205" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <!-- Car Graphic 1 -->
    <rect x="55" y="450" width="325" height="100" rx="6" fill="#090d16"/>
    <path d="M 100 510 C 130 480 230 475 280 500 L 340 510 L 350 530 L 70 530 Z" fill="#2563eb" opacity="0.8"/>
    <circle cx="120" cy="530" r="14" fill="#64748b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="290" cy="530" r="14" fill="#64748b" stroke="#ffffff" stroke-width="3"/>
    <text x="55" y="575" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="700">Volkswagen Golf VII 2.0 TDI</text>
    <text x="55" y="598" font-family="sans-serif" font-size="13" fill="#94a3b8">EZ 2019 • 84.000 km • 110 kW (150 PS)</text>
    <text x="55" y="625" font-family="sans-serif" font-size="18" fill="#60a5fa" font-weight="800">14.890 €</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="422" y="435" width="355" height="205" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <!-- Car Graphic 2 -->
    <rect x="437" y="450" width="325" height="100" rx="6" fill="#090d16"/>
    <path d="M 480 510 C 510 478 610 472 660 498 L 720 510 L 730 530 L 450 530 Z" fill="#38bdf8" opacity="0.8"/>
    <circle cx="500" cy="530" r="14" fill="#64748b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="670" cy="530" r="14" fill="#64748b" stroke="#ffffff" stroke-width="3"/>
    <text x="437" y="575" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="700">BMW 320i Touring M Sport</text>
    <text x="437" y="598" font-family="sans-serif" font-size="13" fill="#94a3b8">EZ 2020 • 62.500 km • 135 kW (184 PS)</text>
    <text x="437" y="625" font-family="sans-serif" font-size="18" fill="#60a5fa" font-weight="800">22.450 €</text>
  </g>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="804" y="435" width="355" height="205" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <!-- Car Graphic 3 -->
    <rect x="819" y="450" width="325" height="100" rx="6" fill="#090d16"/>
    <path d="M 860 510 C 890 480 990 475 1040 500 L 1100 510 L 1110 530 L 830 530 Z" fill="#818cf8" opacity="0.8"/>
    <circle cx="880" cy="530" r="14" fill="#64748b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="1050" cy="530" r="14" fill="#64748b" stroke="#ffffff" stroke-width="3"/>
    <text x="819" y="575" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="700">Audi A4 Avant 2.0 TFSI</text>
    <text x="819" y="598" font-family="sans-serif" font-size="13" fill="#94a3b8">EZ 2018 • 98.000 km • 140 kW (190 PS)</text>
    <text x="819" y="625" font-family="sans-serif" font-size="18" fill="#60a5fa" font-weight="800">18.900 €</text>
  </g>
</svg>
