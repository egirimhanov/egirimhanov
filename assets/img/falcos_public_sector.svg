  <text x="280" y="475" font-family="Fira Code, monospace" font-size="14" fill="#a78bfa">class <tspan fill="#38bdf8">XovZugferdParser</tspan>:</text>
  <text x="310" y="505" font-family="Fira Code, monospace" font-size="14" fill="#cbd5e1">def <tspan fill="#43a53b">parse_document</tspan>(self, xml_file: str) -&gt; Dict[str, Any]:</text>
